version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tokenization-engine-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tokenization_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tokenization_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: tokenization-engine/Dockerfile
    container_name: tokenization-engine-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=super-secret-key-change-in-production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=tokenization_engine
      - RPC_URL=http://hardhat:8545
      - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - TREX_FACTORY_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
